<!doctype html>
<!-- Cover template for build-docs-epub.mjs. Rendered at 1600×2400 and saved as cover.png.
     Placeholders: {{title}}, {{site}}, {{bound}}. Keep the bound date large: it's
     what tells two bindings of the same docs apart in an e-reader's library. -->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1600px; height: 2400px; }
  body {
    box-sizing: border-box;
    padding: 180px 140px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    background: #f4f1ea;
    color: #111;
    font-family: Georgia, 'Times New Roman', serif;
  }
  .site { font-size: 64px; letter-spacing: 0.08em; text-transform: uppercase; }
  h1 { font-size: 150px; line-height: 1.05; margin: 0; font-weight: normal; }
  .bound {
    border-top: 8px solid #111;
    border-bottom: 8px solid #111;
    padding: 60px 0;
    text-align: center;
  }
  .bound .label { font-size: 64px; letter-spacing: 0.15em; text-transform: uppercase; }
  .bound .date { font-size: 130px; font-weight: bold; margin-top: 20px; }
</style>
</head>
<body>
  <div>
    <div class="site">{{site}}</div>
    <h1>{{title}}</h1>
  </div>
  <div class="bound">
    <div class="label">Bound</div>
    <div class="date">{{bound}}</div>
  </div>
</body>
</html>
